<html>
    <head>
        <title>Exemplo CSS GRID</title>
        <style>
            .menu 
            {
                border: 1px solid green;
                grid-area: posmenu;
                margin: 2px;
                display:flex;
                flex-direction: row;
            }
            .header 
            {
                border: 1px solid green;
                grid-area: posheader;
                margin: 2px;
            }
            .card1 
            {
                border: 1px solid green;
                margin: 2px;
            }
            .card2 
            {
                border: 1px solid green;
                margin: 2px;
            }
            .footer 
            {
                border: 1px solid green;
                grid-area: posfooter;
                margin: 2px;
            }
            .container {
                margin-top: 100px;
                display: grid;
                grid-template-areas: 
                'posmenu posheader posheader'
                'posmenu . .'
                'posfooter posfooter posfooter';
            }
        </style>
    </head>
    <body>
        <main>
            <div class="container">
                <div class="menu">
                    <p>MENU</p>   
                    <ul>
                        <li>Item 1</li>
                        <li>Item 2</li>
                        <li>Item 3</li>
                    </ul>    
                    <p>Este é o menu</p>
                </div>
                <div class="header">
                    <p>HEADER</p>          
                </div>
                <div class="card1">
                    <p>CARD 1</p>        
                </div>
                <div class="card2">
                    <p>CARD 2</p>           
                </div>
                <div class="footer">
                    <p>FOOTER</p>          
                </div>
            </div>
        </main>
    </body>
</html>
